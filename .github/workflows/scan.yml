name: todo-reconcile
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile README TODO list
        run: python3 .github/reconcile_todos.py
      - name: Commit and push README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "NO_CHANGE"
          else
            git commit -m "docs: sync README TODO list with implemented items on dev branch"
            git push origin HEAD:dev
          fi
      - name: Print README hash
        run: sha256sum README.md
